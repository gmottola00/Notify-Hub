name: ci

on:
  # Manual run from the Actions tab: a push that brings no new commits (e.g. a
  # branch rename) does not match the paths filter.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "docker/backend.Dockerfile"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"

env:
  IMAGE: ghcr.io/gmottola00/notify-backend

jobs:
  # The same gate as `make check` locally: format, lint, types, tests.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --all-extras --locked

      - name: make check
        run: make check

  build-push-deploy:
    needs: check
    # Pull requests are checked, never deployed; forks never deploy either
    # (they have no INFRA_REPO_TOKEN and no access to the infra repo).
    if: github.event_name != 'pull_request' && github.repository == 'gmottola00/Notify-Hub'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # GitOps CD: bump the image tag in the infra repo; ArgoCD rolls it out.
      - uses: actions/checkout@v4
        with:
          repository: gmottola00/Home-Lab-Infra
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infra

      - name: Bump image tag in kustomization
        working-directory: infra
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Other apps' workflows push to this repo concurrently, so re-apply
          # the edit onto a fresh origin/main on every attempt rather than
          # rebasing.
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main
            git reset --quiet --hard FETCH_HEAD

            yq -i '(.images[] | select(.name == "ghcr.io/gmottola00/notify-backend") | .newTag) = strenv(GITHUB_SHA)' apps/notify/kustomization.yaml

            if git diff --quiet -- apps/notify/kustomization.yaml; then
              echo "notify-backend already at ${GITHUB_SHA:0:7}, nothing to bump."
              exit 0
            fi

            git commit -qam "notify-backend: deploy ${GITHUB_SHA:0:7}"
            if git push --quiet origin HEAD:main; then
              echo "notify-backend bumped to ${GITHUB_SHA:0:7} on attempt ${attempt}."
              exit 0
            fi
            echo "push rejected, retrying (attempt ${attempt}/5)."
            sleep $(( RANDOM % 3 + attempt ))
          done

          echo "::error::could not push the notify-backend tag bump after 5 attempts"
          exit 1
